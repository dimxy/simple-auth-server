<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Actix Web - Auth App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" media="screen" href="/main.css" />
    <script src="/main.js"></script>
  </head>
  <body>
    <div class="login">
      <h1>Try access protected resource</h1>

      <p>Click on button</p>
      <input class="btn" type="submit" value="Whoami" onclick="callService()" />
    </div>
    <div class="login"></div>
      <h1>Result:</h1>

      <textarea id="resultArea" rows="4" cols="50"></textarea>
    </div>
  </body>
  <script>
  function callService() {
    const resultElem = document.getElementById("resultArea");

    call_get('/api/whoami').then(data => {
      console.info(data);
      resultElem.innerHTML = data;
    });
  }
</script>
</html>
