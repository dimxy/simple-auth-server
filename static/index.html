<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Actix Web - Auth App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" media="screen" href="main.css" />
    <script src="main.js"></script>
  </head>
  <body>
    <div class="login">
      <h1>Email Invitation</h1>

      <p>Please enter your email receive Invitation</p>
      <input class="field" type="text" placeholder="email" id="email" /> <br />
      <input class="btn" type="submit" value="Send Email" onclick="sendVerificationEmail()" />
    </div>
    <div class="login">
      <form method="POST" action="/api/auth" id="loginForm">
        <h1>Login</h1>

        <div>
          <label for="loginEmail">Email address:</label>
          <input type="email" class="form-control" id="loginEmail" name="email" placeholder="name@example.com" required>
        </div>

        <div>
          <label for="password">Password:</label>
          <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
        </div>
        <button type="submit">Login</button>
      </form>
    </div>
    <div class="login">
      <form method="POST" action="/api/auth" id="loginForm-kc">
        <h1>Login via Keycloak</h1>
        <button type="submit">Login</button>
      </form>
    </div>
    <div class="login">
      <h1>Login via Keycloak (fetch)</h1>
      <input class="btn" type="submit" value="Login" onclick="callLogin()" />
    </div>
    <div class="login">
      <h1>Login via Keycloak (link)</h1>
      <input class="btn" type="submit" value="Login" onclick="callLogin2()" />
    </div>
    <div class="login">
      <h1>Logout from API</h1>
      <input class="btn" type="submit" value="Logout" onclick="callLogout()" />
    </div>
  </body>
</html>
<script>
  function sendVerificationEmail() {
    let email = document.querySelector('#email');

    http_post('api/invitation', { email: email.value }).then(data => {
      alert('Please check your email.');
      email.value = '';
      console.info(data);
    });
  }
  function callLogin() {
    let uri = `/api/auth?redirect_uri=${window.location.origin}/home.html`;
    console.info(uri);
    http_post(uri)
  }
  function callLogin2() {
    let uri = `/api/auth?redirect_uri=${window.location.origin}/home.html`;
    console.info(uri);
    window.location.href=uri
  }
  function callLogout() {
    let uri = `/api/auth`;
    http_delete(uri)
  }
</script>
